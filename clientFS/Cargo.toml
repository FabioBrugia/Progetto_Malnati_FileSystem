[package]
name = "clientFS"
version = "0.1.0"
edition = "2021"

[dependencies]
fuser = "0.14"
libc = "0.2"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
daemonize = "0.5"
rpassword = "7.4.0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
mockito = "1.6"
