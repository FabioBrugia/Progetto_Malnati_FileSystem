[package]
name = "remote-filesystem"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/server/main.rs"

[dependencies]
# Server dependencies (Actix-web)
actix-web = "4.4"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-cors = "0.6"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
env_logger = "0.11"
log = "0.4"
httpdate = "1.0"

