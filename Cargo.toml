[package]
name = "remote-filesystem"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/server/main.rs"

[dependencies]
# Server dependencies (Actix-web)
actix-web = "4.4"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-cors = "0.6"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
env_logger = "0.11"
log = "0.4"
httpdate = "1.0"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
rand_core = "0.6"
hex = "0.4"
rpassword = "7"
reqwest = { version = "0.11", features = ["blocking", "json"] }
jsonwebtoken = "9"
chrono = "0.4"

[dev-dependencies]
actix-rt = "2"
anyhow = "1.0"
libc = "0.2"
mockito = "1.6"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tempfile = "3"
